<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiquidOS | Aqua Lua Obfuscator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ocean-deep: #020b14;
            --ocean-mid: #061e35;
            --aqua-glow: #00e5ff;
            --aqua-dark: #0066cc;
            --glass-bg: rgba(6, 30, 53, 0.4);
            --glass-border: rgba(0, 229, 255, 0.2);
            --text-main: #e0f7fa;
            --text-muted: #84a9c0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--ocean-deep);
            background-image: 
                radial-gradient(circle at 20% 0%, rgba(0, 229, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 100%, rgba(0, 102, 204, 0.2) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- HEADER --- */
        header {
            padding: 24px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(2, 11, 20, 0.5);
            backdrop-filter: blur(10px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: #fff;
        }

        .logo-icon {
            width: 24px;
            height: 24px;
            background: var(--aqua-glow);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--aqua-glow);
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 6px 12px;
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            color: var(--aqua-glow);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--aqua-glow);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--aqua-glow);
            animation: pulse 2s infinite;
        }

        /* --- WORKSPACE --- */
        .workspace {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            height: 500px;
        }

        .glass-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .panel-header {
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        textarea {
            flex: 1;
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            padding: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        .panel-footer {
            padding: 12px 20px;
            border-top: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
        }

        /* --- BUTTONS --- */
        .btn {
            background: var(--aqua-glow);
            color: #000;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        .btn:hover {
            background: #fff;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.8);
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: var(--text-muted);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .btn-outline {
            background: transparent;
            color: var(--aqua-glow);
            border: 1px solid var(--aqua-glow);
            box-shadow: none;
        }

        .btn-outline:hover {
            background: rgba(0, 229, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
        }

        /* --- LOADING ANIMATION OVERLAY --- */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 11, 20, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .liquid-orb {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--aqua-glow), var(--aqua-dark));
            border-radius: 50%;
            box-shadow: 0 0 30px var(--aqua-glow), inset 0 0 20px rgba(255,255,255,0.5);
            animation: spin 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite, morph 3s ease-in-out infinite;
            margin-bottom: 20px;
        }

        .loading-text {
            color: var(--aqua-glow);
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 2px;
            animation: pulse 1.5s infinite;
        }

        /* --- ANIMATIONS --- */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes morph {
            0%, 100% { border-radius: 50%; }
            50% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
        }

        /* Success/Error Status Colors */
        .success { color: #00ff88 !important; text-shadow: 0 0 10px rgba(0,255,136,0.5); }
        .error { color: #ff3366 !important; text-shadow: 0 0 10px rgba(255,51,102,0.5); }

    </style>
</head>
<body>

    <header>
        <div class="logo">
            <div class="logo-icon"></div>
            LiquidOS
        </div>
        <div class="status-badge">
            <div class="status-dot"></div>
            AQUA CORE ACTIVE
        </div>
    </header>

    <main class="workspace">
        <div class="editor-container">
            <!-- INPUT -->
            <div class="glass-panel">
                <div class="panel-header">
                    <span>Source Code</span>
                    <span>LUA</span>
                </div>
                <textarea id="input" spellcheck="false" placeholder="-- Paste your Lua code here..."></textarea>
                <div class="panel-footer">
                    <span id="input-size" style="font-size: 0.8rem; color: var(--text-muted);">0 bytes</span>
                    <button class="btn" id="obfuscate-btn">Obfuscate</button>
                </div>
            </div>

            <!-- OUTPUT -->
            <div class="glass-panel">
                <div class="panel-header">
                    <span>Protected Output</span>
                    <span>LUA</span>
                </div>
                <textarea id="output" spellcheck="false" readonly placeholder="// Output will appear here after compilation and self-testing..."></textarea>
                <div class="panel-footer">
                    <span id="status-text" style="font-size: 0.8rem; color: var(--text-muted);">Ready.</span>
                    <button class="btn btn-outline" id="copy-btn">Copy Output</button>
                </div>
            </div>
        </div>
    </main>

    <!-- LOADING ANIMATION -->
    <div class="loading-overlay" id="loader">
        <div class="liquid-orb"></div>
        <div class="loading-text" id="loading-text">COMPILING VM1...</div>
    </div>

    <!-- Fengari Lua VM -->
    <script src="https://cdn.jsdelivr.net/npm/fengari-web@0.1.4/dist/fengari-web.js"></script>

    <script>
        // ==========================================
        // THE OBFUSCATOR ENGINE (3-VM ARCHITECTURE)
        // ==========================================
        const OBFUSCATOR_LUA = String.raw`
local Obf = {}

-- 1. VM1: Custom Base Mapper (xx1 = a, xx2 = b)
local function VM1_encode(src)
    local out = {}
    for i = 1, #src do
        local b = src:byte(i)
        out[i] = "xx" .. b
    end
    return table.concat(out, "_")
end

-- 2. VM2: Keyboard Symbols + Hidden XOR
local function VM2_encode(src)
    local key = (100 / 2) - 8 
    local symbols = "!@#$%^&*()_+{}|:<>?~`-=[]\\;',./"
    local out = {}
    for i = 1, #src do
        local b = src:byte(i)
        local xored = b ~ key
        local sym = symbols:sub((xored % #symbols) + 1, (xored % #symbols) + 1)
        out[i] = sym .. xored 
    end
    local shuffled = {}
    for i = #out, 1, -1 do
        table.insert(shuffled, out[i])
    end
    return table.concat(shuffled)
end

-- 3. VM3: String Flipper + Mixed Case Base + Math
local function VM3_encode(src)
    local out = {}
    local rev = src:reverse()
    for i = 1, #rev do
        local b = rev:byte(i)
        local scrambled = (b + (i * 7)) % 256
        if i % 2 == 0 then
            out[i] = string.format("%02X", scrambled)
        else
            out[i] = string.format("%02x", scrambled)
        end
    end
    local base_chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ"
    local final = {}
    for i = 1, #table.concat(out) do
        local c = table.concat(out):sub(i, i)
        local idx = string.find(base_chars, c, 1, true)
        if idx then
            final[i] = string.char(90 - (idx - 1))
        else
            final[i] = c
        end
    end
    return table.concat(final)
end

function Obf.obfuscate(source)
    local vm1 = VM1_encode(source)
    local vm2 = VM2_encode(vm1)
    local vm3 = VM3_encode(vm2)
    
    local payload_string = "\"" .. vm3 .. "\""
    
    local out = "return(function(...)"
    out = out .. "local p=" .. payload_string .. ";"
    out = out .. "local function d3(s)local r={}for i=1,#s do local c=s:sub(i,i)local v=string.byte(c)if v>=65 and v<=90 then r[i]=string.char(((65-(v-65))+128)%256)else r[i]=string.char(v)end end return table.concat(r):reverse()end;"
    out = out .. "local function d2(s)local k=(100/2)-8 local o={}for i=#s,1,-1 do local c=s:sub(i,i)local v=string.byte(c)o[#o+1]=string.char(v~k)end return table.concat(o)end;"
    out = out .. "local function d1(s)local o={}for v in s:gmatch('([^_]+)') do o[#o+1]=string.char(tonumber(v:sub(3))) end return table.concat(o)end;"
    out = out .. "local f,e=load(d1(d2(d3(p))),'@lua','t',_ENV);"
    out = out .. "if not f then error(e)end;"
    out = out .. "return f(...)end)(...)"
    
    return out
end

function run_obf(src)
    return Obf.obfuscate(src)
end
`;

        // ==========================================
        // UI LOGIC & SELF-TESTING ENVIRONMENT
        // ==========================================
        const inputCode = document.getElementById('input');
        const outputCode = document.getElementById('output');
        const obfuscateBtn = document.getElementById('obfuscate-btn');
        const copyBtn = document.getElementById('copy-btn');
        const statusText = document.getElementById('status-text');
        const inputSize = document.getElementById('input-size');
        
        const loader = document.getElementById('loader');
        const loadingText = document.getElementById('loading-text');

        // Update byte counter
        inputCode.addEventListener('input', () => {
            inputSize.textContent = new Blob([inputCode.value]).size + ' bytes';
        });

        function setStatus(msg, type) {
            statusText.textContent = msg;
            statusText.className = type;
        }

        obfuscateBtn.addEventListener('click', () => {
            const src = inputCode.value;
            if (!src.trim()) {
                setStatus("Error: Source code is empty.", "error");
                return;
            }

            // 1. Show Loading Animation
            loader.style.display = 'flex';
            loadingText.textContent = "COMPILING VM1...";
            outputCode.value = "";
            
            // Fake delays to show off the loading animation
            setTimeout(() => {
                loadingText.textContent = "ENCRYPTING VM2...";
                
                setTimeout(() => {
                    loadingText.textContent = "OBFUSCATING VM3...";
                    
                    setTimeout(() => {
                        loadingText.textContent = "RUNNING SELF-ENVIRONMENT TEST...";
                        
                        setTimeout(() => {
                            try {
                                // 2. Run the Obfuscator
                                const driver = OBFUSCATOR_LUA + `
                                    local src = ...
                                    return run_obf(src)
                                `;
                                const result = fengari.load(driver, 'obf')(src);

                                // 3. Self-Environment Test
                                // We run the *obfuscated* code in a sandbox to ensure it actually works.
                                // We intercept 'print' so we don't spam the real console.
                                const testHarness = `
                                    local obf_code = ...
                                    local output = ""
                                    
                                    -- Sandbox the environment to catch prints
                                    local env = setmetatable({}, {__index = _G})
                                    env.print = function(...) 
                                        local args = {...}
                                        for i=1,#args do output = output .. tostring(args[i]) .. " " end
                                        output = output .. "\\n"
                                    end
                                    
                                    local fn, err = load(obf_code, "test", "t", env)
                                    if not fn then return false, err end
                                    
                                    local success, run_err = pcall(fn)
                                    if not success then return false, run_err end
                                    
                                    return true, output
                                `;

                                // Execute the test
                                const testResult = fengari.load(testHarness, 'test')(result);
                                
                                // Check if the test passed (Fengari returns a boolean and the output string)
                                if (testResult === true) {
                                    // Success!
                                    outputCode.value = result;
                                    setStatus("Success! Self-test passed.", "success");
                                } else {
                                    // The obfuscated code threw an error when ran
                                    setStatus("VM Error: Failed to execute safely.", "error");
                                    console.error("Self-test failed:", testResult);
                                    outputCode.value = result; // Still show output so user can debug
                                }

                            } catch (e) {
                                setStatus("Fatal Error: " + (e.message || e), "error");
                                console.error(e);
                            } finally {
                                // Hide loading overlay
                                loader.style.display = 'none';
                            }
                        }, 600); // delay
                    }, 600);
                }, 600);
            }, 600);
        });

        copyBtn.addEventListener('click', () => {
            if (!outputCode.value) return;
            navigator.clipboard.writeText(outputCode.value).then(() => {
                const orig = copyBtn.textContent;
                copyBtn.textContent = 'Copied!';
                copyBtn.style.color = '#00ff88';
                setTimeout(() => {
                    copyBtn.textContent = orig;
                    copyBtn.style.color = 'var(--aqua-glow)';
                }, 2000);
            });
        });
    </script>
</body>
</html>
